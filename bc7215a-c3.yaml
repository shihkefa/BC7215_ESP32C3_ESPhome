substitutions:
  device_name: bc7215a-c3
  friendly_name: 空調遙控器
  # 預設從開發板的原生 USB 插孔讀取日誌。
  # 改接 USB 轉串口端時可設為 UART0。
  logger_uart: USB_SERIAL_JTAG
  # 依使用者照片比對 YD-ESP32-C3-COREBOARD 原理圖；不同批次請核對。
  rgb_pin: GPIO8

esphome:
  name: ${device_name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  min_version: 2026.8.2
  on_boot:
    priority: -100
    then:
      # The climate restores its state before Matter starts; publish it once
      # more after all components have completed setup.
      # This IR controller has a single target, shared by heat/cool/auto.
      # Normalize the nonvolatile SDK default on upgrades from older firmware.
      - matter.set_attribute:
          path: matter_ac.thermostat.control_sequence_of_operation
          value: 4
      - matter.set_attribute:
          path: matter_ac.thermostat.min_setpoint_dead_band
          value: 0
      - lambda: id(matter_controller).report_ac_fan(1, id(ac_controller).matter_fan_mode());
      - matter.set_attribute:
          path: matter_ac.on_off.on_off
          value: !lambda return id(ac_controller).matter_system_mode() != 0;
      - matter.set_attribute:
          path: matter_ac.thermostat.system_mode
          value: !lambda return id(ac_controller).matter_system_mode();
      - matter.set_attribute:
          path: matter_ac.thermostat.thermostat_running_mode
          value: !lambda return id(ac_controller).matter_running_mode();
      - matter.set_attribute:
          path: matter_ac.thermostat.thermostat_running_state
          value: !lambda return id(ac_controller).matter_running_state();
      - matter.set_attribute:
          path: matter_ac.thermostat.occupied_cooling_setpoint
          value: !lambda return id(ac_controller).matter_target_temperature_centi();
      - matter.set_attribute:
          path: matter_ac.thermostat.occupied_heating_setpoint
          value: !lambda return id(ac_controller).matter_target_temperature_centi();
  on_shutdown:
    then:
      - light.turn_off: pairing_rgb

esp32:
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  toolchain: platformio
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [bc7215a, bc7215a_web]
  - source:
      type: local
      path: components
    components: [matter]

logger:
  hardware_uart: ${logger_uart}
  baud_rate: 115200
  level: DEBUG

api:
  reboot_timeout: 0s

network:
  enable_ipv6: true

matter:
  id: matter_controller
  endpoints:
    1:
      id: matter_ac
      room_air_conditioner:
        with_features:
          - heating
          - cooling
          - auto_mode
      clusters:
        fan_control:
          with_features: [multi_speed, auto]
      on_attribute:
        fan_control.fan_mode:
          - lambda: id(ac_controller).matter_set_fan_mode(value);
        on_off.on_off:
          - lambda: id(ac_controller).matter_set_power(value);
        thermostat.system_mode:
          - lambda: id(ac_controller).matter_set_system_mode(value);
        thermostat.occupied_cooling_setpoint:
          - lambda: id(ac_controller).matter_set_target_temperature(value);
        thermostat.occupied_heating_setpoint:
          - lambda: id(ac_controller).matter_set_target_temperature(value);

ota:
  - platform: esphome

wifi:
  id: network_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    # Leave SSID unset: ESPHome uses the MAC-suffixed device name.
    password: "12345678"

captive_portal:

bc7215a_web:

web_server:
  include_internal: true  # 三個維護按鈕僅供 Web 使用，不發布到 HA。
  port: 80
  version: 3
  local: false
  js_url: ""
  css_url: ""
  js_include: web/dashboard.bundle.js
  css_include: web/dashboard.css
  log: false

i2c:
  id: sensor_i2c
  sda: GPIO4
  scl: GPIO5
  frequency: 100kHz
  scan: true

uart:
  id: ir_uart
  rx_pin: GPIO2  # 接 BC7215A TX
  tx_pin: GPIO3  # 接 BC7215A RX
  baud_rate: 19200
  data_bits: 8
  parity: NONE
  stop_bits: 2
  rx_buffer_size: 4096
  flush_timeout: 100ms

climate:
  - platform: bc7215a
    id: ac_controller
    name: 空調_AC
    uart_id: ir_uart
    mod_pin: GPIO0
    busy_pin: GPIO1
    temperature_sensor: room_temperature
    humidity_sensor: room_humidity
    on_state:
      - lambda: id(matter_controller).report_ac_fan(1, id(ac_controller).matter_fan_mode());
      - matter.set_attribute:
          path: matter_ac.on_off.on_off
          value: !lambda return id(ac_controller).matter_system_mode() != 0;
      - matter.set_attribute:
          path: matter_ac.thermostat.system_mode
          value: !lambda return id(ac_controller).matter_system_mode();
      - matter.set_attribute:
          path: matter_ac.thermostat.thermostat_running_mode
          value: !lambda return id(ac_controller).matter_running_mode();
      - matter.set_attribute:
          path: matter_ac.thermostat.thermostat_running_state
          value: !lambda return id(ac_controller).matter_running_state();
      - matter.set_attribute:
          path: matter_ac.thermostat.occupied_cooling_setpoint
          value: !lambda return id(ac_controller).matter_target_temperature_centi();
      - matter.set_attribute:
          path: matter_ac.thermostat.occupied_heating_setpoint
          value: !lambda return id(ac_controller).matter_target_temperature_centi();
    status:
      name: 運作狀態_Status
    match_info:
      name: 候選序號_Match
    pairing_id:
      name: 配對資料識別碼_PairingID
    library_version:
      name: 碼庫版本_LibraryVersion
    paired:
      name: 已配對_Paired
    state_known:
      name: 本次已同步_StateKnown

light:
  - platform: esp32_rmt_led_strip
    id: pairing_rgb
    internal: true
    pin: ${rgb_pin}
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

interval:
  - interval: 100ms
    then:
      - lambda: |-
          using namespace esphome::bc7215a;
          const auto mode = status_led_mode(id(ac_controller).is_pairing(),
              id(network_wifi).is_ap_active(), id(network_wifi).is_connected());
          static auto previous_mode = mode;
          static uint32_t changed_at = millis();
          static uint8_t previous_color = 255;
          if (mode != previous_mode) { previous_mode = mode; changed_at = millis(); }
          const uint8_t color = status_led_color(mode, millis() - changed_at);
          if (color == previous_color) return;
          previous_color = color;
          auto call = id(pairing_rgb).make_call();
          call.set_state(color != 0);
          call.set_rgb((color & 4) ? 1.0f : 0.0f, (color & 2) ? 1.0f : 0.0f, (color & 1) ? 1.0f : 0.0f);
          call.set_brightness(0.20f);
          call.set_transition_length(0);
          call.perform();

button:
  - platform: template
    name: 清除Matter家庭配對_ClearMatterFabrics
    entity_category: config
    icon: mdi:home-remove
    on_press:
      - lambda: id(matter_controller).clear_fabrics();
  - platform: template
    name: 開啟Matter配對_MatterPair
    internal: true
    on_press:
      - lambda: id(matter_controller).open_commissioning_window();
  - platform: template
    name: 重整紅外接收_RecoverReception
    internal: true
    on_press:
      - lambda: id(ac_controller).recover_reception();
  - platform: template
    name: 重新檢查通訊_RetryCommunication
    internal: true
    on_press:
      - lambda: id(ac_controller).retry_communication();
  - platform: template
    name: 開始配對_Pair
    on_press:
      - lambda: id(ac_controller).start_pairing();
  - platform: template
    name: 下一個匹配_NextMatch
    on_press:
      - lambda: id(ac_controller).next_match();
  - platform: template
    name: 取消配對_CancelPair
    on_press:
      - lambda: id(ac_controller).cancel_pairing();
  - platform: restart
    name: 重新啟動_Restart

binary_sensor:
  - platform: status
    name: 連線狀態_Online

sensor:
  - platform: sht4x
    id: room_sht40
    i2c_id: sensor_i2c
    address: 0x44
    precision: High
    heater_max_duty: 0.0
    temperature:
      id: room_temperature
      name: 室內溫度_Temperature
      accuracy_decimals: 1
      on_value:
        then:
          - matter.set_attribute:
              path: matter_ac.thermostat.local_temperature
              # Matter nullable int16 null: do not leave stale readings visible.
              value: !lambda |-
                return std::isfinite(x) && x >= -40.0f && x <= 125.0f
                    ? static_cast<int16_t>(std::lround(x * 100.0f))
                    : static_cast<int16_t>(-32768);
    humidity:
      id: room_humidity
      name: 室內濕度_Humidity
      accuracy_decimals: 1
    update_interval: 30s
  - platform: wifi_signal
    name: WiFi訊號_RSSI
    update_interval: 60s
  - platform: uptime
    name: 運作時間_Uptime

text_sensor:
  - platform: matter
    commissioning_status:
      name: Matter配對狀態_MatterStatus
    qr_code:
      name: Matter配對碼
    manual_pairing_code:
      name: Matter手動配對碼
  - platform: wifi_info
    ip_address:
      name: IP位址_Address
    ssid:
      name: WiFi名稱_SSID
    bssid:
      name: WiFi基地台_BSSID
    mac_address:
      name: 裝置MAC_Address
