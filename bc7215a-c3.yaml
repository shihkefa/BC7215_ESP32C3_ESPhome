substitutions:
  device_name: bc7215a-c3
  friendly_name: 空調遙控器
  # 預設接板上的 USB 轉串口端（常標 UART）。
  # 若接原生 USB 端，改為 USB_SERIAL_JTAG。
  logger_uart: UART0
  # 依使用者照片比對 YD-ESP32-C3-COREBOARD 原理圖；不同批次請核對。
  rgb_pin: GPIO8

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.2
  on_shutdown:
    then:
      - light.turn_off: pairing_rgb

esp32:
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: components
    components: [bc7215a]

logger:
  hardware_uart: ${logger_uart}
  baud_rate: 115200
  level: DEBUG

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: BC7215A-Setup
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  local: true
  log: false

i2c:
  id: sensor_i2c
  sda: GPIO4
  scl: GPIO5
  frequency: 100kHz
  scan: true

uart:
  id: ir_uart
  rx_pin: GPIO2  # 接 BC7215A TX
  tx_pin: GPIO3  # 接 BC7215A RX
  baud_rate: 19200
  data_bits: 8
  parity: NONE
  stop_bits: 2
  rx_buffer_size: 4096
  flush_timeout: 100ms

climate:
  - platform: bc7215a
    id: ac_controller
    name: 空調_AC
    uart_id: ir_uart
    mod_pin: GPIO0
    busy_pin: GPIO1
    temperature_sensor: room_temperature
    humidity_sensor: room_humidity
    status:
      name: 運作狀態_Status
    match_info:
      name: 候選序號_Match
    pairing_id:
      name: 配對資料識別碼_PairingID
    library_version:
      name: 碼庫版本_LibraryVersion
    vertical_swing_status:
      name: 上下擺風學習狀態_VerticalSwing
    horizontal_swing_status:
      name: 左右擺風學習狀態_HorizontalSwing
    swing_state:
      name: 擺風狀態_SwingState
    paired:
      name: 已配對_Paired
    state_known:
      name: 本次已同步_StateKnown

light:
  - platform: esp32_rmt_led_strip
    id: pairing_rgb
    internal: true
    pin: ${rgb_pin}
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    effects:
      - addressable_rainbow:
          name: 配對七彩
          speed: 10
          width: 50

interval:
  - interval: 100ms
    then:
      - lambda: |-
          // Read the actual pairing phase, including extra sampling.
          // Restarting the effect every tick would prevent a smooth cycle.
          static bool initialized = false;
          static bool was_pairing = false;
          const bool pairing = id(ac_controller).is_pairing();
          if (initialized && pairing == was_pairing) return;
          initialized = true;
          was_pairing = pairing;
          if (pairing) {
            auto call = id(pairing_rgb).turn_on();
            call.set_brightness(0.20f);
            call.set_effect("配對七彩");
            call.set_transition_length(0);
            call.perform();
          } else {
            auto call = id(pairing_rgb).turn_off();
            call.set_transition_length(0);
            call.perform();
          }

button:
  - platform: template
    name: 重整紅外接收_RecoverReception
    on_press:
      - lambda: id(ac_controller).recover_reception();
  - platform: template
    name: 重新檢查通訊_RetryCommunication
    on_press:
      - lambda: id(ac_controller).retry_communication();
  - platform: template
    name: 開始配對_Pair
    on_press:
      - lambda: id(ac_controller).start_pairing();
  - platform: template
    name: 下一個匹配_NextMatch
    on_press:
      - lambda: id(ac_controller).next_match();
  - platform: template
    name: 取消配對_CancelPair
    on_press:
      - lambda: id(ac_controller).cancel_pairing();
  - platform: template
    name: 學習上下擺風_LearnVertical
    on_press:
      - lambda: id(ac_controller).start_swing_learning(false);
  - platform: template
    name: 學習左右擺風_LearnHorizontal
    on_press:
      - lambda: id(ac_controller).start_swing_learning(true);
  - platform: template
    name: 擷取擺風樣本_CaptureSwing
    on_press:
      - lambda: id(ac_controller).arm_swing_sample();
  - platform: template
    name: 取消擺風學習_CancelSwing
    on_press:
      - lambda: id(ac_controller).cancel_swing_learning();
  - platform: restart
    name: 重新啟動_Restart

binary_sensor:
  - platform: status
    name: 連線狀態_Online

sensor:
  - platform: sht4x
    id: room_sht40
    i2c_id: sensor_i2c
    address: 0x44
    precision: High
    heater_max_duty: 0.0
    temperature:
      id: room_temperature
      name: 室內溫度_Temperature
      accuracy_decimals: 1
    humidity:
      id: room_humidity
      name: 室內濕度_Humidity
      accuracy_decimals: 1
    update_interval: 30s
  - platform: wifi_signal
    name: WiFi訊號_RSSI
    update_interval: 60s
  - platform: uptime
    name: 運作時間_Uptime

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP位址_Address
    ssid:
      name: WiFi名稱_SSID
    bssid:
      name: WiFi基地台_BSSID
    mac_address:
      name: 裝置MAC_Address
